name: Prepare R example data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE: ghcr.io/pacificcommunity/fisheries-workflow@sha256:9dea950a713b87daad728517138bcb664a151f0f5b44a1d5370623734a5bca9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate and import declared synthetic data inside the exact container
        run: |
          docker pull "$IMAGE"
          mkdir -p .test-output/data
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env PAPER_RUNTIME_IMAGE="$IMAGE" \
            --env PAPER_RUNTIME_IMAGE_URL=https://github.com/PacificCommunity/ofp-sam-docker-images/pkgs/container/fisheries-workflow \
            --env GITHUB_SHA --env GITHUB_REPOSITORY --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.test-output:/generated" --workdir /workspace \
            "$IMAGE" sh -c 'Rscript --vanilla scripts/generate-data.R /generated/source-data.json && python3 scripts/import-r-data.py /generated/source-data.json --output /generated/data'
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.test-output')
          files = {str(p.relative_to(root)): {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size} for p in root.rglob('*') if p.is_file()}
          (root / 'data-generation-record.json').write_text(json.dumps({'source_commit': os.environ['GITHUB_SHA'], 'repository': os.environ['GITHUB_REPOSITORY'], 'github_run': os.environ['GITHUB_RUN_ID'], 'container': os.environ['IMAGE'], 'files': files}, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-source-data-${{ github.sha }}
          path: .test-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
