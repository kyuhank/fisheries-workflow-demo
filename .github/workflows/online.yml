name: Check hosted demonstration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fisheries-workflow-online-check
  cancel-in-progress: false
jobs:
  online:
    if: github.repository == 'kyuhank/fisheries-workflow-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          Ncpus: '2'
          use-public-rspm: 'true'
      - name: Prepare the coordinator and source pins
        run: |
          make setup
          make hydrate-sources
      - name: Check new hosted runs and retained producing records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          session_file="$RUNNER_TEMP/paper-reader.json"
          Rscript --vanilla scripts/check-live.R --mode create --case baseline --evidence .test-output/live/create --expected-commit "$GITHUB_SHA" --session-file "$session_file"
          for live_case in baseline growthupdate msebuffer; do
            Rscript --vanilla scripts/check-live.R --mode execute --case "$live_case" --evidence ".test-output/live/$live_case" --expected-commit "$GITHUB_SHA" --session-file "$session_file"
          done
