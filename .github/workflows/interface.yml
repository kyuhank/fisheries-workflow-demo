name: Check diagram
on:
  push:
    paths: ['jobs/**', 'workflow/**', 'app/**', 'docs/**', 'scripts/build.py', 'scripts/check-*.py', '.github/workflows/interface.yml']
  pull_request:
    paths: ['jobs/**', 'workflow/**', 'app/**', 'docs/**', 'scripts/build.py', 'scripts/check-*.py', '.github/workflows/interface.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the current pages in the preserved runtime
        env:
          IMAGE: ghcr.io/pacificcommunity/fisheries-workflow@sha256:53549c0f7b159968fcb5c8861fff7f8d88572d0cf8764237e983f69bbd4581cc
        run: |
          docker pull "$IMAGE"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$IMAGE" sh -c 'python scripts/build.py && python scripts/release.py'
      - name: Install browser checks
        run: |
          python3 -m venv .browser-check
          .browser-check/bin/pip install playwright==1.60.0
          .browser-check/bin/python -m playwright install --with-deps chromium webkit
      - name: Check layout and controls
        run: |
          .browser-check/bin/python scripts/check-diagram.py --engine chromium
          .browser-check/bin/python scripts/check-diagram.py --engine webkit
          .browser-check/bin/python scripts/check-records.py
          .browser-check/bin/python scripts/check-connection.py
          .browser-check/bin/python scripts/check-browser.py
          .browser-check/bin/python scripts/check-settings.py
          .browser-check/bin/python scripts/check-plans.py
          .browser-check/bin/python scripts/check-reports.py
          .browser-check/bin/python scripts/check-orchestration.py
          .browser-check/bin/python scripts/check-mse.py
      - name: Preserve the checked pages and download files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-release-${{ github.sha }}
          path: |
            docs/
            dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
