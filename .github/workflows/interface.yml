name: Check diagram
on:
  push:
    paths: ['app/**', 'docs/**', 'scripts/build.py', 'scripts/check-*.py', '.github/workflows/interface.yml']
  pull_request:
    paths: ['app/**', 'docs/**', 'scripts/build.py', 'scripts/check-*.py', '.github/workflows/interface.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser checks
        run: |
          python3 -m venv .browser-check
          .browser-check/bin/pip install playwright==1.60.0
          .browser-check/bin/python -m playwright install --with-deps chromium webkit
      - name: Check layout and controls
        run: |
          .browser-check/bin/python scripts/check-diagram.py --engine chromium
          .browser-check/bin/python scripts/check-diagram.py --engine webkit
          .browser-check/bin/python scripts/check-records.py
          .browser-check/bin/python scripts/check-connection.py
          .browser-check/bin/python scripts/check-browser.py
          .browser-check/bin/python scripts/check-settings.py
          .browser-check/bin/python scripts/check-plans.py
          .browser-check/bin/python scripts/check-reports.py
          .browser-check/bin/python scripts/check-orchestration.py
          .browser-check/bin/python scripts/check-mse.py
