name: Check diagram and reader controls
on:
  push:
    paths: ['app/**', 'docs/**', 'scripts/check-*.py', 'scripts/pdf_checks.py', 'scripts/refresh-interface.py', '.github/workflows/interface.yml']
  pull_request:
    paths: ['app/**', 'docs/**', 'scripts/check-*.py', 'scripts/pdf_checks.py', 'scripts/refresh-interface.py', '.github/workflows/interface.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble current interface with saved results
        run: python3 scripts/refresh-interface.py
      - name: Install browser checks
        run: |
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-browser-checks > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          python3 -m venv .browser-check
          .browser-check/bin/pip install playwright==1.60.0
          .browser-check/bin/python -m playwright install --with-deps chromium webkit
      - name: Check layouts, results and handovers
        run: |
          .browser-check/bin/python scripts/check-diagram.py --engine chromium
          .browser-check/bin/python scripts/check-diagram.py --engine webkit
          check_status=0
          for check_file in records connection browser settings reports orchestration mse handover; do
            .browser-check/bin/python "scripts/check-${check_file}.py" || check_status=1
          done
          exit "$check_status"
