name: Live paper demonstration
run-name: Paper demonstration · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Registered demonstration request
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: paper-demo-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  analysis:
    if: github.repository == 'kyuhank/fisheries-workflow-demo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PAPER_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Retrieve the analysis code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/
            !/dist/
          sparse-checkout-cone-mode: false
      - name: Report runner setup
        run: sh scripts/announce.sh
      - name: Set up the host R coordinator
        run: sh scripts/setup-runner-r.sh
      - name: Install the four host packages
        run: Rscript scripts/setup-host.R
      - name: Prepare the pinned analysis repositories
        run: |
          Rscript scripts/run-live.R --announce
          Rscript scripts/run-workflow.R hydrate
      - name: Run component Makefiles in their assigned images and save results
        run: Rscript scripts/run-live.R
