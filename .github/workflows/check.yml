name: Check calculations
on:
  push:
    paths: ['source-lock.template.json', 'scripts/hydrate-sources.py', 'Makefile', 'jobs/**', 'workflow/**', 'cloud/**', 'supabase/functions/**', 'data/**', 'tests/**', 'run.py', 'verify.py', 'Dockerfile', '.github/workflows/check.yml']
  pull_request:
    paths: ['source-lock.template.json', 'scripts/hydrate-sources.py', 'Makefile', 'jobs/**', 'workflow/**', 'cloud/**', 'supabase/functions/**', 'data/**', 'tests/**', 'run.py', 'verify.py', 'Dockerfile', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and assemble pinned analysis repositories
        run: python3 scripts/hydrate-sources.py
      - name: Check actual R calculations and Quarto reports in the preserved container
        env:
          IMAGE: ghcr.io/pacificcommunity/fisheries-workflow@sha256:9dea950a713b87daad728517138bcb664a151f0f5b44a1d5370623734a5bca9d
          PAPER_RUNTIME_IMAGE_URL: https://github.com/PacificCommunity/ofp-sam-docker-images/pkgs/container/fisheries-workflow
        run: |
          docker pull "$IMAGE"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env PAPER_RUNTIME_IMAGE="$IMAGE" --env PAPER_RUNTIME_IMAGE_URL \
            --env PAPER_NATIVE_INTEGRATION=1 \
            --env GITHUB_SHA --env GITHUB_REPOSITORY --env GITHUB_RUN_ID \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            "$IMAGE" make --no-print-directory --silent inside-check
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and assemble pinned analysis repositories
        run: python3 scripts/hydrate-sources.py
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - name: Check server access and transient-error recovery
        run: |
          deno check supabase/functions/paper-api/index.ts
          deno test supabase/functions/paper-api/*_test.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPER_TEST_POSTGRES_CONTAINER: paper-test-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_IMAGE: postgres:17-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and assemble pinned analysis repositories
        run: python3 scripts/hydrate-sources.py
      - name: Start an isolated disposable PostgreSQL fixture
        run: |
          docker run --detach --name "$PAPER_TEST_POSTGRES_CONTAINER" \
            --network none --env POSTGRES_PASSWORD=test-only "$POSTGRES_IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec "$PAPER_TEST_POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$PAPER_TEST_POSTGRES_CONTAINER"
          exit 1
      - name: Check runner database transactions
        run: python3 -m unittest discover -s tests -p test_runner_database.py -v
      - name: Remove the disposable fixture
        if: always()
        run: |
          if docker container inspect "$PAPER_TEST_POSTGRES_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$PAPER_TEST_POSTGRES_CONTAINER"
          fi
