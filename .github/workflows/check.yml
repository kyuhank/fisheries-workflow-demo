name: Check calculations
on:
  push:
    paths: ['R/**', 'scripts/**', 'tests-r/**', 'source-lock.template.json', 'source-files.sha256.json', 'runtime-overrides.json', 'Makefile', 'jobs/**', 'workflow/**', 'cloud/**', 'supabase/functions/**', 'data/**', 'tests/**', 'build-info.json', '.github/workflows/check.yml']
  pull_request:
    paths: ['R/**', 'scripts/**', 'tests-r/**', 'source-lock.template.json', 'source-files.sha256.json', 'runtime-overrides.json', 'Makefile', 'jobs/**', 'workflow/**', 'cloud/**', 'supabase/functions/**', 'data/**', 'tests/**', 'build-info.json', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAPER_DATA_MODE: public
      PAPER_JOB_CPUS: '1'
      PAPER_JOB_MEMORY: 2g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the host R coordinator
        run: sh scripts/setup-runner-r.sh
      - name: Install and record host package versions
        run: Rscript --vanilla scripts/setup-host.R
      - name: Verify and assemble pinned analysis repositories
        run: make hydrate-sources
      - name: Check R coordination and input contracts
        run: make check
      - name: Run all public-data jobs through their component Makefiles
        run: make run OUTPUT=runs
      - name: Verify all 22 results and calculation/rendering image receipts
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          source("R/sources.R")
          state <- json_read("runs/state.json")
          expected <- vapply(json_read("workflow/jobs.json")$jobs, function(job) job$key, character(1))
          stopifnot(length(expected) == 22L, setequal(names(state$records), expected))
          for (key in expected) {
            record <- state$records[[key]]
            stopifnot(isTRUE(record$report_rendering$quarto_executed))
            for (name in names(record$outputs)) {
              stopifnot(identical(file_sha256(source_path(file.path("runs", key), name)), record$outputs[[name]]))
            }
            calculation <- json_read(file.path("runs", key, "container-inside-job.json"))
            rendering <- json_read(file.path("runs", key, "container-render.json"))
            stopifnot(identical(calculation$image_id, record$runtime$image_id),
              identical(rendering$image_id, record$report_rendering$runtime$image_id),
              calculation$exit_code == 0L, rendering$exit_code == 0L,
              !calculation$running, !rendering$running)
          }
          cat("Verified 22 public-data results, artifact hashes and actual image receipts.\n")
          RSCRIPT
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - name: Check server access and transient-error recovery
        run: |
          deno check supabase/functions/paper-api/index.ts
          deno test supabase/functions/paper-api/*_test.ts
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPER_TEST_POSTGRES_CONTAINER: paper-test-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_IMAGE: postgres:17-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start an isolated disposable PostgreSQL fixture
        run: |
          docker run --detach --name "$PAPER_TEST_POSTGRES_CONTAINER" \
            --network none --env POSTGRES_PASSWORD=test-only "$POSTGRES_IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec "$PAPER_TEST_POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$PAPER_TEST_POSTGRES_CONTAINER"
          exit 1
      - name: Check runner database transactions
        run: python3 -m unittest discover -s tests -p test_runner_database.py -v
      - name: Remove the disposable fixture
        if: always()
        run: |
          if docker container inspect "$PAPER_TEST_POSTGRES_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$PAPER_TEST_POSTGRES_CONTAINER"
          fi
