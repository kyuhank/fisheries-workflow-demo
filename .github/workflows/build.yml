name: Build demo release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.5.1'
          Ncpus: '2'
          use-public-rspm: 'true'
      - name: Prepare host R
        run: Rscript --vanilla scripts/setup-host.R
      - name: Calculate and build the saved example
        run: |
          make run
          make site
          make release
          cat dist/SHA256SUMS.txt
